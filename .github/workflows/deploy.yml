name: Deploy TRACE Landing Page

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create dist directory
        run: |
          mkdir -p dist
          # Copy only the necessary public files
          cp index.html dist/
          cp agb.html dist/
          cp cookies.html dist/
          cp datenschutz.html dist/
          cp impressum.html dist/
          # Copy CSS, JS and Image assets (using glob)
          cp *.css dist/ 2>/dev/null || echo "No CSS files"
          cp *.js dist/ 2>/dev/null || echo "No JS files"
          cp *.png dist/ 2>/dev/null || echo "No PNG files"
          cp *.svg dist/ 2>/dev/null || echo "No SVG files"
          # Ensure .nojekyll is present
          touch dist/.nojekyll
          # Explicitly remove unwanted files if copied by glob (safety)
          rm -f dist/PRAESENTATION_SKRIPT.html
          rm -f dist/intro.mp4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Select the dist directory to upload
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
